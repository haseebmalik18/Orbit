<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit</title>
<style>
  :root {
    color-scheme: light;
    --ground:    #f4f6f8;
    --raised:    #ffffff;
    --rule:      #dbe1e7;
    --rule-soft: #e8ecf0;
    --ink:       #0d1519;
    --ink-muted: #586873;
    --ink-faint: #7d8b96;
    --signal:    #4f46c7;
    --good:      #1d7a45;
    --bad:       #c0362c;
    --hold:      #9a6b0f;
    --tint:      rgba(79, 70, 199, .07);
    --good-tint: rgba(29, 122, 69, .10);
    --bad-tint:  rgba(192, 54, 44, .10);
    --hold-tint: rgba(154, 107, 15, .11);
    --track:     rgba(13, 21, 25, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --ground: #0e1519; --raised: #151e24;
      --rule: #222e36; --rule-soft: #1b252b;
      --ink: #eaf0f3; --ink-muted: #8ea0ac; --ink-faint: #63737f;
      --signal: #8079e8; --good: #35a866; --bad: #e2604f; --hold: #b8842a;
      --tint: rgba(128, 121, 232, .13);
      --good-tint: rgba(53, 168, 102, .14);
      --bad-tint: rgba(226, 96, 79, .14);
      --hold-tint: rgba(184, 132, 42, .15);
      --track: rgba(234, 240, 243, .09);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0e1519; --raised: #151e24;
    --rule: #222e36; --rule-soft: #1b252b;
    --ink: #eaf0f3; --ink-muted: #8ea0ac; --ink-faint: #63737f;
    --signal: #8079e8; --good: #35a866; --bad: #e2604f; --hold: #b8842a;
    --tint: rgba(128, 121, 232, .13);
    --good-tint: rgba(53, 168, 102, .14);
    --bad-tint: rgba(226, 96, 79, .14);
    --hold-tint: rgba(184, 132, 42, .15);
    --track: rgba(234, 240, 243, .09);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 13px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: .92em;
  }

  header {
    display: flex; align-items: baseline; gap: 14px;
    padding: 13px 20px; border-bottom: 1px solid var(--rule);
    background: var(--raised);
  }
  .mark { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .mark span { color: var(--signal); }
  .ledger { margin-left: auto; display: flex; gap: 18px; color: var(--ink-muted); }
  .ledger b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

  main {
    display: grid; grid-template-columns: minmax(230px, 300px) 1fr;
    height: calc(100vh - 51px);
  }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
  .index { border-right: 1px solid var(--rule); overflow-y: auto; }
  .record { overflow-y: auto; padding: 24px 28px 60px; }
  /* Without a ceiling the findings row stretches to the window and strands
     its verdict a screen away from its label. */
  .wrap { max-width: 860px; }

  .entry {
    display: block; width: 100%; text-align: left; font: inherit; color: inherit;
    background: none; border: 0; border-bottom: 1px solid var(--rule-soft);
    padding: 12px 18px 12px 16px; cursor: pointer;
    border-left: 2px solid transparent;
  }
  .entry:hover { background: var(--raised); }
  .entry:focus-visible { outline: 2px solid var(--signal); outline-offset: -2px; }
  .entry[aria-current="true"] { background: var(--tint); border-left-color: var(--signal); }
  .entry .id { font-weight: 500; }
  .entry .in { color: var(--ink-faint); }
  .entry .standing { margin-top: 5px; color: var(--ink-muted); }
  .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-right: 6px;
  }
  .dot.good { background: var(--good); }
  .dot.hold { background: var(--hold); }
  .dot.idle { background: var(--ink-faint); }

  h2 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .where { color: var(--ink-muted); margin: 3px 0 0; }
  .fault {
    margin: 16px 0 0; padding: 11px 14px;
    background: var(--raised); border: 1px solid var(--rule);
    border-left: 2px solid var(--bad);
  }
  h3 {
    font-size: 13px; font-weight: 600; margin: 30px 0 0;
    padding-bottom: 9px; border-bottom: 1px solid var(--rule);
  }

  /* The verdict is the one thing a person needs from across the room. */
  .verdict {
    margin: 14px 0 0; padding: 14px 16px;
    background: var(--good-tint); border: 1px solid transparent;
  }
  .verdict.hold { background: var(--hold-tint); }
  .verdict .call {
    font-size: 17px; font-weight: 600; letter-spacing: -.01em; color: var(--good);
  }
  .verdict.hold .call { color: var(--hold); }
  .verdict .because { margin: 3px 0 0; color: var(--ink-muted); max-width: 60ch; }

  .findings { list-style: none; margin: 14px 0 0; padding: 0; }
  .finding {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 2px; border-bottom: 1px solid var(--rule-soft);
  }
  .finding .glyph { width: 12px; flex: none; font-weight: 600; text-align: center; }
  .finding .what { flex: 1; min-width: 0; }
  .finding .took {
    color: var(--ink-faint); font-variant-numeric: tabular-nums;
    width: 50px; text-align: right; flex: none;
  }
  .finding .said { width: 62px; text-align: right; flex: none; }
  .finding.pass .glyph, .finding.pass .said { color: var(--good); }
  .finding.fail .glyph, .finding.fail .said { color: var(--bad); }
  .finding.skipped .glyph, .finding.skipped .said { color: var(--hold); }
  .finding.pending .glyph, .finding.pending .said { color: var(--ink-faint); }

  /* Elapsed time, to scale. Replaying history dominates the budget, and that
     is the honest shape of the work rather than a decoration. */
  .track { width: 96px; flex: none; height: 4px; background: var(--track); }
  .track > i { display: block; height: 100%; background: var(--ink-faint); }
  .finding.pass .track > i { background: var(--good); }
  .finding.fail .track > i { background: var(--bad); }
  @media (prefers-reduced-motion: no-preference) {
    .track > i { transition: width .45s cubic-bezier(.2, .7, .3, 1); }
  }

  /* The one image that carries Orbit's argument, so it is sized to be seen. */
  .replayed {
    padding: 12px 14px 13px; margin: 2px 0 0 24px;
    background: var(--good-tint); border-bottom: 1px solid var(--rule-soft);
  }
  .replayed.broken { background: var(--bad-tint); }
  .runs { display: flex; gap: 4px; margin-bottom: 8px; }
  .runs i { width: 34px; height: 20px; background: var(--good); display: block; }
  .runs i.broke { background: var(--bad); }
  .replayed .caption { color: var(--ink-muted); }

  .thread { list-style: none; margin: 4px 0 0; padding: 0 0 0 22px; position: relative; }
  .thread::before {
    content: ""; position: absolute; left: 4px; top: 16px; bottom: 16px;
    width: 1px; background: var(--rule);
  }
  .step { position: relative; padding: 14px 0; }
  .step::before {
    content: ""; position: absolute; left: -22px; top: 18px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--signal); box-shadow: 0 0 0 3px var(--ground);
  }
  .step .who { font-weight: 600; text-transform: capitalize; }
  .step .model { color: var(--ink-faint); margin-left: 9px; }
  .step .said { margin: 6px 0 0; max-width: 66ch; color: var(--ink-muted); }
  .step .said p { margin: 0 0 .7em; }
  .step .said p:last-child { margin-bottom: 0; }

  .blank { color: var(--ink-faint); padding: 30px 20px; max-width: 46ch; }
  .record > .blank { padding-left: 0; }

  body[data-scope="task"] .ledger,
  body[data-scope="task"] .index { display: none; }
  body[data-scope="task"] main { grid-template-columns: 1fr; height: auto; }
  body[data-scope="task"] .record { padding: 18px 20px 40px; }
  body[data-scope="task"] header { padding: 11px 20px; }
</style>
</head>
<body>
<header>
  <div class="mark">Orbit<span>.</span></div>
  <div class="ledger" id="ledger"></div>
</header>

<main>
  <div class="index" id="index"></div>
  <div class="record" id="record"><div class="blank">Loading.</div></div>
</main>

<script>
const CHECKS = ["repro", "fix", "regression", "scope"];

// What each check put to the test, worded so the row still reads correctly
// when it failed or never ran.
const TESTED = {
  repro: "Reproduce the reported failure",
  fix: "Patch clears the failure",
  regression: "Recorded runs still pass",
  scope: "Changes stay inside the diagnosed scope",
};
const SAID = { pass: "passed", fail: "failed", skipped: "not run", pending: "waiting" };
const GLYPH = { pass: "✓", fail: "✗", skipped: "–", pending: "·" };

let selected = null;

const query = new URLSearchParams(location.search);

// Airflow fills {DAG_ID}/{TASK_ID}/{RUN_ID} in the registered href. Tokens it
// does not recognise arrive verbatim and must not be read as real ids.
function coordinate(name) {
  const value = query.get(name);
  return value && !/^\{[A-Z_]+\}$/.test(value) ? value : null;
}

const SCOPE = {
  dag_id: coordinate("dag_id"),
  task_id: coordinate("task_id"),
  run_id: coordinate("run_id"),
};
const scoped = Boolean(SCOPE.dag_id && SCOPE.task_id);
if (scoped) document.body.dataset.scope = "task";

function incidentPath() {
  if (!scoped) return "/incidents";
  const q = new URLSearchParams();
  for (const key of ["dag_id", "task_id", "run_id"]) {
    if (SCOPE[key]) q.set(key, SCOPE[key]);
  }
  return "/incidents?" + q.toString();
}

async function api(path) {
  const r = await fetch("../api" + path, { credentials: "same-origin" });
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function paragraphs(text) {
  return String(text || "").split(/\n{2,}/)
    .map(p => "<p>" + esc(p.trim()) + "</p>").join("");
}

function standing(incident) {
  if (incident.resolution === "verified_awaiting_approval")
    return { tone: "good", words: "Verified, waiting on you" };
  if (incident.resolution === "escalated_not_verified")
    return { tone: "hold", words: "Not verified, escalated" };
  return { tone: "idle", words: incident.status.replace(/_/g, " ") };
}

function renderIndex(incidents) {
  const el = document.getElementById("index");
  if (!incidents.length) {
    el.innerHTML = '<div class="blank">Nothing has failed yet. Orbit opens a record the moment a watched task does.</div>';
    return;
  }
  el.innerHTML = incidents.map(i => {
    const s = standing(i);
    return '<button class="entry" aria-current="' + (i.id === selected) +
      '" data-id="' + esc(i.id) + '">' +
      '<div><span class="id mono">' + esc(i.task_id) + "</span>" +
      '<span class="in"> in ' + esc(i.dag_id) + "</span></div>" +
      '<div class="standing"><span class="dot ' + s.tone + '" aria-hidden="true"></span>' +
      esc(s.words) + "</div></button>";
  }).join("");
  el.querySelectorAll(".entry").forEach(b => {
    b.onclick = () => { selected = b.dataset.id; refresh(); };
  });
}

function detailOf(row) { return (row && row.detail) || {}; }

// The count of recorded runs replayed is the argument Orbit is making, so it
// gets drawn rather than buried in a number.
function replayStrip(row) {
  const d = detailOf(row);
  if (typeof d.total !== "number" || d.total <= 0) return "";
  const broke = d.total - d.passed;
  let cells = "";
  for (let n = 0; n < d.total; n++) {
    cells += '<i class="' + (n < d.passed ? "" : "broke") + '"></i>';
  }
  const caption = broke
    ? broke + " of " + d.total + " recorded runs broke under this patch"
    : "All " + d.total + " recorded runs of this pipeline still pass with the patch applied";
  return '<li class="replayed' + (broke ? " broken" : "") + '">' +
    '<div class="runs" role="img" aria-label="' + esc(caption) + '">' + cells + "</div>" +
    '<div class="caption">' + esc(caption) + "</div></li>";
}

function renderFindings(body) {
  const byName = {};
  body.checks.forEach(c => { byName[c.check] = c; });
  const longest = Math.max(1, ...body.checks.map(c => c.duration_ms || 0));

  return CHECKS.map(name => {
    const row = byName[name];
    const status = row ? row.status : "pending";
    const ms = (row && row.duration_ms) || 0;
    const took = ms ? (ms / 1000).toFixed(1) + "s" : "";
    const d = detailOf(row);
    const note = name === "scope" && Array.isArray(d.changed) ? d.changed.join(", ") : "";

    const item = '<li class="finding ' + status + '">' +
      '<span class="glyph" aria-hidden="true">' + GLYPH[status] + "</span>" +
      '<span class="what">' + TESTED[name] +
        (note ? ' <span class="mono" style="color:var(--ink-faint)">' + esc(note) + "</span>" : "") +
      "</span>" +
      '<span class="track" aria-hidden="true"><i style="width:' +
        Math.round((ms / longest) * 100) + '%"></i></span>' +
      '<span class="said">' + SAID[status] + "</span>" +
      '<span class="took">' + took + "</span></li>";

    return name === "regression" ? item + replayStrip(row) : item;
  }).join("");
}

async function renderRecord(id) {
  const [incident, checks, transcript] = await Promise.all([
    api("/incidents/" + id),
    api("/incidents/" + id + "/checks"),
    api("/incidents/" + id + "/transcript"),
  ]);

  const regression = checks.checks.filter(c => c.check === "regression")[0];
  const replayed = detailOf(regression).total;
  const proved = checks.passed === checks.total;
  const verdict = proved
    ? '<div class="verdict"><div class="call">Fix verified</div><p class="because">' +
      "All " + checks.total + " checks cleared" +
      (replayed ? ", including a replay against " + replayed + " recorded runs of this pipeline" : "") +
      ". Orbit is asking you to approve it.</p></div>"
    : '<div class="verdict hold"><div class="call">Not verified</div><p class="because">' +
      checks.passed + " of " + checks.total + " checks cleared, so Orbit will not " +
      "vouch for this patch. Sent to you undecided.</p></div>";

  const thread = transcript.messages.length
    ? '<ol class="thread">' + transcript.messages.map(m =>
        '<li class="step"><div><span class="who">' + esc(m.agent) + "</span>" +
        '<span class="model mono">' + esc(m.model || "") + "</span></div>" +
        '<div class="said">' + paragraphs(m.content) + "</div></li>").join("") + "</ol>"
    : '<p class="because">No agent has reported yet.</p>';

  document.getElementById("record").innerHTML = '<div class="wrap">' +
    '<h2 class="mono">' + esc(incident.task_id) + "</h2>" +
    '<p class="where">failed in ' + esc(incident.dag_id) + "</p>" +
    '<p class="fault mono">' + esc(incident.exception_type) + ": " +
      esc(incident.exception_message) + "</p>" +
    "<h3>Verification</h3>" + verdict +
    '<ul class="findings">' + renderFindings(checks) + "</ul>" +
    "<h3>How Orbit got there</h3>" + thread + "</div>";
}

async function refreshScoped() {
  const incidents = (await api(incidentPath())).incidents;
  if (!incidents.length) {
    document.getElementById("record").innerHTML =
      '<div class="blank">No Orbit incident for this task instance.</div>';
    selected = null;
    return;
  }
  selected = incidents[0].id;
  await renderRecord(selected);
}

async function refreshAll() {
  const [list, stats] = await Promise.all([api(incidentPath()), api("/stats")]);
  const incidents = list.incidents;
  document.getElementById("ledger").innerHTML =
    "<div><b>" + stats.verified + "</b> verified</div>" +
    "<div><b>" + stats.escalated + "</b> escalated</div>" +
    "<div><b>" + stats.total_incidents + "</b> seen</div>";
  if (selected && !incidents.some(i => i.id === selected)) selected = null;
  if (!selected && incidents.length) selected = incidents[0].id;
  renderIndex(incidents);
  if (selected) await renderRecord(selected);
  else document.getElementById("record").innerHTML =
    '<div class="blank">Select a record to see what Orbit proved.</div>';
}

async function refresh() {
  try {
    await (scoped ? refreshScoped() : refreshAll());
  } catch (e) {
    const where = scoped ? "record" : "index";
    document.getElementById(where).innerHTML =
      '<div class="blank">Orbit\'s API did not answer (' + esc(e.message) +
      "). Check that Airflow is running and that you are signed in.</div>";
  }
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
