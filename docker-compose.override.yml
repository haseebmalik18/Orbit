x-orbit-volumes: &orbit-volumes
  - ./src:/usr/local/airflow/src:ro
  - ./fixtures:/usr/local/airflow/fixtures:ro
  # scheduler writes incidents, api-server reads them: needs to be one file
  - ./.orbit:/usr/local/airflow/.orbit:rw
  # An approved patch becomes a real commit, so git needs a real repository.
  # Mounting .git alone would leave every unmounted path looking deleted.
  - .:/usr/local/airflow/repo:rw

# Astro's compose sets all_admins=True so local dev needs no login. Orbit is
# mounted inside the api-server and inherits that, which would leave its
# endpoints open. Turn it off so auth is actually exercised.
x-orbit-env: &orbit-env
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "False"

services:
  scheduler:
    volumes: *orbit-volumes
    environment: *orbit-env
  dag-processor:
    volumes: *orbit-volumes
    environment: *orbit-env
  api-server:
    volumes: *orbit-volumes
    environment: *orbit-env
  triggerer:
    volumes: *orbit-volumes
    environment: *orbit-env
